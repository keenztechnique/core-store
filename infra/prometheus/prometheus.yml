global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'core-api'
    static_configs:
      - targets: ['host.docker.internal:8080'] # или порт, на котором крутится ваш бэкенд внутри сети

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['core_node_exporter:9100']